name: Scraper Analyses Trading

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'  # 12h00 GMT → 14h00 réel Abidjan (décalage -2h)

jobs:
  scraper-analyses:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Installer dependances
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml
    
    - name: Lancer Scraper Analyses Trading
      run: |
        python scraper_brvm_analyses.py

