name: Scraper Propositions BRVM

on:
  schedule:
    # Lundi à Vendredi à 13h42 GMT (15h42 Abidjan)
    - cron: '42 13 * * 1-5'
  
  workflow_dispatch:

jobs:
  scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --break-system-packages requests beautifulsoup4 lxml
      
      - name: Run Propositions Generator
        run: python scraper_brvm_propositions.py
      
      - name: Commit and push brvm_propositions.json
        run: |
          git config user.email "bot@brvm.local"
          git config user.name "BRVM Automation Bot"
          
          # ✅ ORDRE CORRECT: Add → Commit → PULL → Push
          git add brvm_propositions.json || echo "File not found, skipping add"
          
          # Commit avec || true pour continuer même si rien à commiter
          git commit -m "🤖 Auto-update: BRVM Propositions $(date +'%Y-%m-%d %H:%M')" || true
          
          # ⭐ PULL TOUJOURS AVANT PUSH avec rebase + autostash
          git pull origin main --rebase --autostash
          
          # Push après le pull
          git push origin main
          
          echo "✅ Git sync completed: brvm_propositions.json"
      
      - name: View logs
        if: always()
        run: |
          if [ -f propositions_brvm_*.log ]; then
            echo "📋 Propositions Generator Logs:"
            cat propositions_brvm_*.log
          fi
