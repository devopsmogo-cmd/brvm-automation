name: Scraper Dividendes

on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * 1-5'  # 14h30 Lun-Ven

jobs:
  scraper-dividendes:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Installer dépendances
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml
    
    - name: Lancer Scraper Dividendes
      run: |
        python scraper_brvm_dividendes.py
    
    - name: Upload données
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: brvm-dividendes-data
        path: |
          brvm_dividendes_historique.json
          brvm_logs/
