name: Scraper Bulletins Cote

on:
  workflow_dispatch:
  schedule:
    - cron: '35 15 * * 1-5'  # 15h35 Lun-Ven

jobs:
  scraper-cote:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Installer dépendances
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml
    
    - name: Lancer Scraper Bulletins Cote
      run: |
        python scraper_brvm_bulletins_cote.py
    
    - name: Upload données
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: brvm-cote-data
        path: |
          brvm_cote_du_jour.json
          brvm_logs/
