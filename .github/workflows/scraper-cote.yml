name: Scraper Bulletins Cote

on:
  workflow_dispatch:
  schedule:
    - cron: '35 15 * * 1-5'

jobs:
  scraper-cote:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Installer dependances
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml
    
    - name: Lancer Scraper Bulletins Cote
      run: |
        python scraper_brvm_bulletins_cote.py
