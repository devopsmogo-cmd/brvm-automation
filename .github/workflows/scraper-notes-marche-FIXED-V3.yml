name: Scraper Notes Marche BRVM

on:
  schedule:
    # Lundi à Vendredi à 13h44 GMT (15h44 Abidjan)
    # Après scraper-propositions mais avant rapport quotidien
    - cron: '44 13 * * 1-5'
  
  workflow_dispatch:

jobs:
  scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --break-system-packages requests beautifulsoup4 lxml
      
      - name: Run Notes Marche Generator
        run: python scraper_brvm_notes_marche.py
      
      - name: Auto-commit brvm_notes_marche.json
        run: |
          git config user.email "bot@brvm.local"
          git config user.name "BRVM Automation Bot"
          git pull origin main --rebase
          git add brvm_notes_marche.json
          if git diff --cached --exit-code > /dev/null; then
            echo "✅ No changes to commit"
          else
            git commit -m "🤖 Auto-update: BRVM Notes Marche $(date +'%Y-%m-%d %H:%M')"
            git push origin main
            echo "✅ Commited: brvm_notes_marche.json"
          fi
      
      - name: View logs
        if: always()
        run: |
          if [ -f notes_marche_*.log ]; then
            echo "📋 Logs:"
            cat notes_marche_*.log
          fi
